name: pipeline-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python demo.py && python pipeline.py --manifest data/demo/metadata.jsonl --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-parquet-demo
          path: artifacts/
