name: pipeline-tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      public_sample:
        description: Run the network-dependent public Flickr8k sample
        type: boolean
        default: false
      acknowledge_terms:
        description: I reviewed upstream terms; do not redistribute the sample
        type: boolean
        default: false
      dataset_revision:
        description: Dataset revision; main is resolved and recorded as a commit SHA
        type: string
        default: main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYSPARK_PYTHON: python
      EVIDENCE_DIR: artifacts/test-evidence
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt -r requirements-spark.txt
      - run: python -m unittest -v test_pipeline test_prepare test_spark
      - name: Run original demo through Spark
        run: |
          python demo.py
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          demo = Path("data/demo").resolve()
          with tempfile.TemporaryDirectory(prefix="spark-demo-") as temporary:
              root = Path(temporary)
              images = root / "images"
              images.mkdir()
              metadata = root / "metadata.jsonl"
              shutil.copyfile(demo / "metadata.jsonl", metadata)
              names = {json.loads(line)["path"] for line in metadata.read_text().splitlines()}
              for name in sorted(names):
                  path = Path(name)
                  if (
                      path.name != name
                      or "\\" in name
                      or name.startswith((".", "_"))
                      or path.suffix.lower() not in {".png", ".jpg", ".jpeg"}
                  ):
                      raise ValueError("Demo image paths must be flat PNG/JPEG filenames")
                  source = demo / name
                  if source.is_file():
                      shutil.copyfile(source, images / name)
                  # Missing images remain absent so validation can reject them.
              subprocess.run([
                  "spark-submit", "--master", "local[2]", "spark_pipeline.py",
                  "--metadata", str(metadata), "--images", str(images),
                  "--output", "artifacts/spark", "--version", "original-demo-v1",
              ], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-evidence
          path: |
            artifacts/test-evidence/
            artifacts/spark/original-demo-v1/quality-report.json
      - name: Prepare public sample with provenance
        if: github.event_name == 'workflow_dispatch' && inputs.public_sample
        env:
          ACK: ${{ inputs.acknowledge_terms }}
          REVISION: ${{ inputs.dataset_revision }}
        run: |
          test "$ACK" = true || { echo 'Review upstream terms and enable acknowledgment'; exit 1; }
          python prepare_public.py --limit 16 --revision "$REVISION" --acknowledge-terms
      - name: Run public sample
        if: github.event_name == 'workflow_dispatch' && inputs.public_sample
        run: spark-submit --master 'local[2]' spark_pipeline.py --metadata data/public-flickr8k/metadata.jsonl --images data/public-flickr8k/images --output artifacts/spark --version public-flickr8k-v1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.public_sample
        with:
          name: public-sample-run-evidence
          path: |
            artifacts/spark/public-flickr8k-v1/quality-report.json
            artifacts/spark/public-flickr8k-v1/manifest.json
